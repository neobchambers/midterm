<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Restaurant - Reservation</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        >
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="site-wrapper">
    <nav class="navbar navbar-expand-lg restaurant-nav">

        <div class="container">

            <a class="navbar-brand" href="index.html">
                Restaurant
            </a>


            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNav"
            >

                <span class="navbar-toggler-icon"></span>

            </button>


            <div class="collapse navbar-collapse" id="mainNav">

                <ul class="navbar-nav mx-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="menu.html">
                            Menu
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="about.html">
                            About Us
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="reservation.html">
                            Reservations
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="contact.html">
                            Contact
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>
    <main class="container reservation-page">
        <h1 class="page-title">
            Reserve a table
        </h1>
        <form class="reservation-form">
            <label for="name">
                Name:
            </label>
            <input
                type="text"
                id="name"
                name="name"
                required
            >
            <label for="date">
                Date:
            </label>
            <input
                type="date"
                id="date"
                name="date"
                required
            >
            <label for="time">
                Time:
            </label>
            <input
                type="time"
                id="time"
                name="time"
                required
            >
            <label for="guests">
                Number of guests:
            </label>

            <input
                type="number"
                id="guests"
                name="guests"
                min="1"
                max="20"
                required
            >
            <button
                type="submit"
                class="reservation-button"
            >
                Book a table
            </button>

        </form>

        <section class="reservation-table">
            <h2>
                Special requests
            </h2>
            <table>
                <thead>
                    <tr>
                        <th>Request</th>
                        <th>Available</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Window table</td>
                        <td>Yes</td>
                    </tr>
                    <tr>
                        <td>Birthday table</td>
                        <td>Yes</td>
                    </tr>
                    <tr>
                        <td>Large group</td>
                        <td>On request</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
    <footer class="footer">
        <div class="footer-top">
            <a href="contact.html">
                Contact
            </a>
            <span>|</span>
            <span>Phone</span>
            <span>|</span>
            <span>Email</span>
            <span class="copyright">
                2026 Restaurant
            </span>

        </div>
        <div class="footer-bottom">

            <p>
                Contact: +7 777 777 88 88
            </p>

            <p>
                Email: restaurant@gmail.com
            </p>

        </div>

    </footer>

</div>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
